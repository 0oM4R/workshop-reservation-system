services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: workshops
      POSTGRES_PASSWORD: workshops
      POSTGRES_DB: workshops
    ports:
      # Published for local development; 8.4 must unpublish it for the full stack
      - "127.0.0.1:5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./backend/db/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U workshops"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  db-data:
